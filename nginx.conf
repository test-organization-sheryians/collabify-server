env APP_ENV;
env BACKEND_HOST;
env BACKEND_PORT;
env REDIS_HOST;
env REDIS_PORT;
env ALLOWED_ORIGIN;
env ENABLE_ORIGIN_CHECK;

worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 10000;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile off;
    tcp_nodelay on;
    keepalive_timeout 75s;

    lua_shared_dict redis_cache 10m;
    lua_shared_dict locks 1m;

    limit_req_zone $binary_remote_addr zone=ws_handshake:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    client_max_body_size 32k;
    proxy_buffering off;
    proxy_request_buffering off;

    access_log /usr/local/openresty/nginx/logs/access.log;
    error_log /usr/local/openresty/nginx/logs/error.log warn;

    upstream backend_server {
        server host.docker.internal:3001;
    }

    server {
        listen 80;
        server_name localhost;

        location /graphql {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                return 204;
            }

            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Origin $http_origin;
            
            # -----------------------------------------------------------
            # FIX: STREAMING & BODY HANDLING
            # -----------------------------------------------------------
            # Force forwarding of Content-Length to prevent Nginx/Backend 
            # chunking mismatches that cause hangs with some runtimes.
            proxy_set_header Content-Length $content_length;
            proxy_set_header Transfer-Encoding "";
        }

        location /ws {
            limit_req zone=ws_handshake burst=10 nodelay;
            limit_conn ws_conn 10;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_pass http://backend_server;
        }

        location / {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Origin $http_origin;

            # Fix for streaming/body compatibility
            proxy_set_header Content-Length $content_length;
            proxy_set_header Transfer-Encoding "";
        }
    }
}
