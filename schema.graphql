"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON
  @specifiedBy(
    url: "http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf"
  )

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  health: String!
  me: User
  getWorkspaceInviteInfo(token: String!): WorkspaceInviteInfo!
  myWorkspaces: [Workspace!]!
  onboardingStatus: OnboardingStatus!
  workspaceBySlug(slug: String!): Workspace!
  workspaceMembers(workspaceId: ID!): [WorkspaceMember!]!

  """
  Get paginated notifications for the current user.
  """
  notifications(
    limit: Int
    cursor: String
    isRead: Boolean
  ): NotificationConnection!

  """
  Get count of unread notifications.
  """
  unreadNotificationCount: Int!
  myProjects(workspaceId: ID!): [Project!]!
  projectBySlug(workspaceId: ID!, slug: String!): Project
  project(id: ID!): Project
  getChannelMessages(
    channelId: ID!
    limit: Int
    beforeCursor: ID
  ): [ChatMessage!]!
  getThreadMessages(
    parentMessageId: ID!
    limit: Int
    beforeCursor: ID
  ): [ChatMessage!]!
  getMessageById(messageId: ID!): ChatMessage
  getMessagesAfterCursor(
    channelId: ID!
    afterCursor: ID!
    limit: Int
  ): [ChatMessage!]!
  getMissingMessages(
    channelId: ID!
    rangeStart: ID!
    rangeEnd: ID!
  ): [ChatMessage!]!
  getUserChannels(userId: ID!): [ChatChannel!]!
  getChannelMembers(channelId: ID!): [ChatMember!]!
  getChannelUnreadCount(channelId: ID!): Int!
  getSubscribedChannels: [ID!]!
  getLastReadMessage(channelId: ID!): ID
  getPresenceMap(userIds: [ID!]!): [UserPresence!]!
}

type Mutation {
  _health: String
  syncUser(
    clerkId: String!
    email: String!
    fullName: String
    avatarUrl: String
    emailVerified: Boolean
  ): User!
  acceptWorkspaceInvite(input: AcceptInviteInput!): JoinResponse!
  checkSlugAvailability(slug: String!): AvailabilityResponse!
  createOnboardingWorkspace: Workspace!
  createWorkspace(slug: String!, name: String!): Workspace!
  inviteToWorkspace(input: InviteToWorkspaceInput!): InviteResponse!
  removeWorkspaceMember(workspaceId: ID!, memberId: ID!): InviteResponse!
  updateWorkspaceMemberRole(
    workspaceId: ID!
    memberId: ID!
    role: String!
  ): WorkspaceMember!

  """
  Mark specific notifications as read.
  """
  markNotificationRead(ids: [ID!]!): Boolean!

  """
  Mark all notifications as read.
  """
  markAllNotificationsRead: Boolean!
  createProject(workspaceId: ID!, input: CreateProjectInput!): Project!
  checkProjectSlugAvailability(
    workspaceId: ID!
    slug: String!
  ): AvailabilityResponse!
  createChannel(input: CreateChannelInput!): ChatChannel!
  archiveChannel(input: ArchiveChannelInput!): ChatChannel!
  renameChannel(input: RenameChannelInput!): ChatChannel!
  createThread(input: CreateThreadInput!): ChatMessage!
}

type User {
  id: ID!
  email: String!
  fullName: String
  avatarUrl: String
  status: String!
  createdAt: String!
  updatedAt: String!
}

type Workspace {
  id: ID!
  slug: String!
  name: String!
  logoUrl: String
  domainWhitelist: String
  createdAt: String!
  updatedAt: String!
}

input AcceptInviteInput {
  token: String!
  userId: String
  userEmail: String
}

type JoinResponse {
  success: Boolean!
  message: String!
  workspaceSlug: String!
}

type AvailabilityResponse {
  available: Boolean!
  message: String
  reservationId: String
  reason: String
}

input InviteToWorkspaceInput {
  workspaceId: ID!
  emails: [String!]!
}

type InviteResponse {
  success: Boolean!
  message: String!
  invitedCount: Int!
}

type WorkspaceInviteInfo {
  workspaceName: String!
  workspaceLogoUrl: String
  inviterName: String
}

type OnboardingStatus {
  hasUser: Boolean!
  hasWorkspace: Boolean!
  hasProject: Boolean!
  workspaceSlug: String
}

type WorkspaceMember {
  id: ID!
  role: String!
  joinedAt: String!
  user: User!
}

type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
}

type NotificationEdge {
  node: Notification!
  cursor: String!
}

type Notification {
  id: ID!
  recipientUserId: String!
  actorId: String
  entityType: String!
  entityId: String!
  category: String!
  data: JSON
  isRead: Boolean!
  isArchived: Boolean!
  createdAt: DateTime!
  actor: User
  chatMessage: ChatMessage
  workspace: Workspace
  project: Project
  task: Task
  page: Page
}

type Task {
  id: ID!
  title: String!
  statusName: String!
}

type Page {
  id: ID!
  title: String!
}

type ProjectMember {
  id: ID!
  user: User!
  userId: ID!
  role: String
  joinedAt: String!
}

type Project {
  id: ID!
  workspaceId: String!
  key: String!
  name: String!
  description: String
  isPrivate: Boolean
  isArchived: Boolean
  createdAt: String!
  updatedAt: String!
  members: [ProjectMember!]!
}

input CreateProjectInput {
  name: String!
  slug: String
  description: String
}

type ChatChannel {
  id: ID!
  workspaceId: ID!
  projectId: ID
  type: ChannelType!
  name: String
  topic: String
  isArchived: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  members: [ChatMember!]
  lastMessage: ChatMessage
  memberCount: Int!
}

enum ChannelType {
  PUBLIC
  PRIVATE
  DM
}

type ChatMember {
  id: ID!
  channelId: ID!
  userId: ID!
  lastReadMsgId: ID
  lastDeliveredMsgId: ID
  role: String!
  isMuted: Boolean!
  joinedAt: DateTime!
}

type ChatMessage {
  id: ID!
  channelId: ID!
  authorUserId: ID!
  content: JSON!
  type: String!
  createdAt: DateTime!
}

type UserPresence {
  userId: ID!
  status: PresenceStatus!
  lastActiveAt: DateTime
}

enum PresenceStatus {
  ONLINE
  AWAY
  OFFLINE
}

input CreateChannelInput {
  workspaceId: ID!
  projectId: ID
  name: String
  topic: String
  type: ChannelType
  memberUserIds: [ID!]
}

input ArchiveChannelInput {
  channelId: ID!
}

input RenameChannelInput {
  channelId: ID!
  name: String!
}

input CreateThreadInput {
  parentMessageId: ID!
}
